name: attachement
services:
  app:
    build: .
    image: attachement-app:latest
    ports:
      - "5174:5174"
    # Written by the deploy pipeline from the APP_ENV GitHub secret.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      AUTH_TRUST_HOST: "true" # NextAuth v5 behind a reverse proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5174/api/auth/providers"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
